version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glonass_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./var/data:/var/www/html/var/data
    networks:
      - glonass-network
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_SECRET=${APP_SECRET:-very-secret}
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
      - GLONASS_API_URL=${GLONASS_API_URL}
      - GLONASS_API_LOGIN=${GLONASS_API_LOGIN}
      - GLONASS_API_PASSWORD=${GLONASS_API_PASSWORD}
      - MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: glonass_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - glonass-network
    depends_on:
      - app

  messenger-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glonass_messenger_worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./var/data:/var/www/html/var/data
    networks:
      - glonass-network
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_SECRET=${APP_SECRET:-very-secret}
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data.db
      - GLONASS_API_URL=${GLONASS_API_URL}
      - GLONASS_API_LOGIN=${GLONASS_API_LOGIN}
      - GLONASS_API_PASSWORD=${GLONASS_API_PASSWORD}
      - MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0
    command: php bin/console messenger:consume async -vv
    depends_on:
      - app

networks:
  glonass-network:
    driver: bridge
